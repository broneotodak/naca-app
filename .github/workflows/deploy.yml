name: Build & Deploy NACA

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.*'
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so we can diff HEAD~1 to detect what changed
          fetch-depth: 2

      - name: Detect changed areas
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          echo "$CHANGED" | grep -qE '^(lib/|web/|pubspec\.)' && WEB=1 || WEB=0
          echo "$CHANGED" | grep -qE '^backend/' && BACKEND=1 || BACKEND=0
          echo "web=$WEB" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "Changes — web:$WEB backend:$BACKEND"

      # ─── WEB ────────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.web == '1'
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: steps.changes.outputs.web == '1'
        run: flutter pub get

      # lib/config.dart is gitignored (the backend token is not stored in the repo).
      # Generate it from the template, injecting authToken from the NACA_AUTH_TOKEN secret.
      - name: Generate config.dart (authToken from secret)
        if: steps.changes.outputs.web == '1'
        env:
          NACA_AUTH_TOKEN: ${{ secrets.NACA_AUTH_TOKEN }}
        run: |
          if [ -z "$NACA_AUTH_TOKEN" ]; then
            echo "::error::NACA_AUTH_TOKEN secret is not set — web build would ship a broken token"; exit 1
          fi
          cp lib/config.dart.example lib/config.dart
          sed -i "s|__NACA_AUTH_TOKEN__|${NACA_AUTH_TOKEN}|g" lib/config.dart
          echo "Generated lib/config.dart (authToken injected from secret)"

      - name: Build web
        if: steps.changes.outputs.web == '1'
        run: flutter build web --release

      # Web HOSTING was decommissioned with the nclaw VPS (deleted 2026-07-28).
      # naca.neotodak.com now fronts the backend API via hermes nginx -> EdgeXpert
      # :3100; the app ships as iOS/native builds. The web build above stays as a
      # compile check. If web hosting returns, deploy via an edge-cc recipe
      # (registry meta.deploy_projects), not scp from CI.
      - name: Web build is a compile check only (no web hosting since 2026-07-28)
        if: steps.changes.outputs.web == '1'
        run: echo "Web build OK — not deployed (web hosting decommissioned with nclaw; see comment above)."

      # ─── BACKEND ────────────────────────────────────────────────────
      # Backend deploys are OWNED BY THE FLEET PIPELINE since 2026-08-05:
      # merged PRs fire the github-webhook -> agent_registry meta.deploy_projects
      # -> edge-cc deploy_project recipe (fetch, diff, backup, sync, pm2 restart,
      # /api/health verify, WhatsApp report). The old ssh-to-nclaw step died with
      # that VPS (deleted 2026-07-28) and failed every backend merge since.

      # ─── NOTIFICATION ───────────────────────────────────────────────
      - name: Build deploy summary
        id: summary
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          COMMIT_SHA=$(git log -1 --pretty=format:'%h')
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l | tr -d ' ')
          CHANGED_AREAS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | sed 's|/.*||' | sort -u | tr '\n' ', ' | sed 's/,$//')
          # Build a tag indicating what shipped (web / backend / both)
          WEB="${{ steps.changes.outputs.web }}"
          BACKEND="${{ steps.changes.outputs.backend }}"
          if [ "$WEB" = "1" ] && [ "$BACKEND" = "1" ]; then SCOPE="Web + Backend"
          elif [ "$WEB" = "1" ]; then SCOPE="Web"
          elif [ "$BACKEND" = "1" ]; then SCOPE="Backend"
          else SCOPE="No-op"; fi
          echo "msg=🚀 *NACA ${SCOPE} Deployed*\n\n📝 ${COMMIT_MSG}\n👤 ${COMMIT_AUTHOR} (${COMMIT_SHA})\n📁 ${FILES_CHANGED} files changed (${CHANGED_AREAS})\n⏱️ $(TZ='Asia/Kuala_Lumpur' date '+%H:%M MYT')" >> $GITHUB_OUTPUT

      - name: Notify via agent_commands
        if: success()
        # Pass commit-derived text via env so apostrophes, quotes, backticks
        # in commit messages don't break the bash string. Use jq to build the
        # JSON payload safely (no manual escaping). This is the same rule as
        # neo-brain memory feedback_no_execsync_with_llm_text — never inline
        # arbitrary text into a shell-quoted string.
        env:
          DEPLOY_MSG: ${{ steps.summary.outputs.msg }}
          NACA_AUTH_TOKEN: ${{ secrets.NACA_AUTH_TOKEN }}
        run: |
          PAYLOAD=$(jq -nc \
            --arg msg "$DEPLOY_MSG" \
            --arg to "60177519610" \
            '{from_agent:"github-actions", to_agent:"siti", command:"send_whatsapp_notification", payload:{message:$msg, to:$to}}')
          curl -sS -X POST \
            -H "Authorization: Bearer $NACA_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://naca.neotodak.com/api/agents/commands || true
